/* Fare calculation: QAR 25 includes the first 1.8 km.
   The rate below preserves the original 20.95 km / QAR 58.00 example. */
var BASE_FARE=25, INCLUDED_KM=1.8, RATE_PER_KM=(58-BASE_FARE)/(20.95-INCLUDED_KM);
function fareForDistance(distance){
  var km=Math.max(0,parseFloat(distance)||0);
  return Math.max(BASE_FARE,BASE_FARE+Math.max(0,km-INCLUDED_KM)*RATE_PER_KM);
}
function setText(i,text){
  var n=node(i);
  n.dataset.t=text;
  update(i);
}
function updateFareFromDistance(){
  var fare=fareForDistance(curText(18));
  var amount=fare.toFixed(2);
  setText(4,amount+" QR");
  setText(14,amount);
}
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}

function layout(u,text){
  var chars=Array.from(text),items=[],cum=0,fs=u.fs,i,c,a;
  meas.setAttribute("font-size",fs);meas.setAttribute("font-family",FB);
  for(i=0;i<chars.length;i++){c=chars[i];
    if(GL[c])a=GL[c][0]*fs;else if(c===" ")a=.2*fs;else{meas.textContent=c;a=meas.getComputedTextLength()||fs*.45}
    items.push([c,cum,a]);cum+=a+u.ls}
  return {items:items,total:Math.max(cum-u.ls,0)}}
function draw(u,L,g,X0){
  while(g.firstChild)g.removeChild(g.firstChild);var fs=u.fs;
  if(X0===undefined)X0=AN[u.id]=="c"?u.cx-L.total/2:AN[u.id]=="r"?u.x1-L.total:u.x0;
  L.items.forEach(function(it){var c=it[0];if(c===" ")return;var x=X0+it[1];
    for(var b=0;b<=(u.bold>0?1:0);b++){var xx=x+b*u.bold;
      if(GL[c])g.appendChild(el("path",{d:GL[c][1],fill:u.fill,transform:"translate("+xx.toFixed(3)+" "+u.y+") scale("+(fs/2048)+" "+(-fs/2048)+")"}));
      else{var t=el("text",{x:xx,y:u.y,"font-size":fs,"font-family":FB,fill:u.fill});t.textContent=c;g.appendChild(t)}}});}
function node(i){return svg.querySelector('.u[data-i="'+i+'"]')}
function curText(i){var n=node(i);return n.dataset.t!==undefined?n.dataset.t:UN[i].text}
function update(i){
  var ch=null;CH.forEach(function(c){if(c.ids.indexOf(i)>=0)ch=c});
  if(!ch){var u=UN[i],n=node(i);n.querySelector(".orig").style.display="none";draw(u,layout(u,curText(i)),n.querySelector(".gen"));return}
  var ids=ch.ids,W=ids.map(function(j){return layout(UN[j],curText(j))}),gaps=[],j;
  for(j=0;j<ids.length-1;j++)gaps.push(UN[ids[j+1]].x0-UN[ids[j]].x1);
  var tot=0;W.forEach(function(w){tot+=w.total});gaps.forEach(function(g){tot+=g});
  var start=ch.m=="r"?UN[ids[ids.length-1]].x1-tot:(UN[ids[0]].x0+UN[ids[ids.length-1]].x1)/2-tot/2,x=start;
  ids.forEach(function(id,k){var u=UN[id],n=node(id);
    if(n.dataset.t!==undefined){n.setAttribute("transform","");n.querySelector(".orig").style.display="none";draw(u,W[k],n.querySelector(".gen"),x)}
    else n.setAttribute("transform","translate("+(x-u.x0).toFixed(3)+" 0)");
    x+=W[k].total+(gaps[k]||0)});
  if(ids[0]===0)document.getElementById("gen").setAttribute("transform","translate("+(start-8.5).toFixed(2)+" 52.3)");}
var cur=null;

  ed.style.height=h+"px";ed.style.lineHeight=h+"px";

 var bytes=[],i,c;for(i=0;i<str.length;i++){c=str.charCodeAt(i);if(c<128)bytes.push(c);else if(c<2048)bytes.push(192|c>>6,128|c&63);else bytes.push(224|c>>12,128|(c>>6&63),128|c&63)}

  for(i=16;i<64;i++){var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}

   h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0}
